name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cli-receipt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        run: npm test
      - name: Run package dry-run
        run: npm run release:check
      - name: Check docs assets and metadata
        run: |
          grep -q "zero runtime dependencies" README.md
          grep -q "rel=\"canonical\"" docs/index.html
          grep -q "property=\"og:image\"" docs/index.html
          grep -q "name=\"twitter:card\"" docs/index.html
          test -f docs/assets/favicon.svg
          test -f docs/assets/social-preview.svg
      - name: Whitespace check
        run: git diff --check
